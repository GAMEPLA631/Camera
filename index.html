<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIL-SPEC NIGHT VISION & AURA SCANNER</title>
    <style>
        :root {
            --nv-green: #00ff66;
            --nv-glow: rgba(0, 255, 102, 0.4);
            --hud-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050805;
            color: var(--nv-green);
            font-family: var(--hud-font);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Viewport kontajner */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            display: none;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        /* Scanlines & CRT efekt */
        .overlay-crt {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Taktický HUD Display */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            text-shadow: 0 0 8px var(--nv-green);
        }

        .hud-header, .hud-footer {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .hud-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 1px dashed var(--nv-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .hud-reticle::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--nv-green);
        }

        .rec-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Kontrolný panel */
        .control-panel {
            position: absolute;
            bottom: 25px;
            z-index: 20;
            background: rgba(0, 15, 5, 0.85);
            border: 1px solid var(--nv-green);
            box-shadow: 0 0 20px var(--nv-glow);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        button, select {
            background: rgba(0, 30, 10, 0.9);
            border: 1px solid var(--nv-green);
            color: var(--nv-green);
            padding: 8px 14px;
            font-family: var(--hud-font);
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 0 0 4px var(--nv-green);
            transition: 0.2s all;
        }

        button:hover, select:hover {
            background: var(--nv-green);
            color: #000;
            box-shadow: 0 0 12px var(--nv-green);
        }

        .btn-record {
            background: #400;
            border-color: #f33;
            color: #f66;
            text-shadow: 0 0 4px #f33;
        }

        .btn-record.recording {
            background: #f00;
            color: #fff;
            box-shadow: 0 0 15px #f00;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        input[type="range"] {
            accent-color: var(--nv-green);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="outputCanvas"></canvas>
        <div class="overlay-crt"></div>

        <!-- HUD Taktické prvky -->
        <div class="hud-layer">
            <div class="hud-header">
                <div>SYS: ONLINE // NV-GEN4</div>
                <div id="recStatus" style="display: none;"><span class="rec-dot"></span>REC [<span id="recTimer">00:00</span>]</div>
                <div id="fpsCounter">FPS: 60</div>
            </div>
            
            <div class="hud-reticle">
                <div style="font-size: 10px; position: absolute; top: 10px;">BIO-SCAN: ACTIVE</div>
                <div style="font-size: 10px; position: absolute; bottom: 10px;">WALL-AURA: ON</div>
            </div>

            <div class="hud-footer">
                <div id="resIndicator">RES: 1920x1080 @60FPS</div>
                <div id="gainIndicator">LIGHT GAIN: +200%</div>
                <div>ISO: AUTO (ULTRA-NIGHT)</div>
            </div>
        </div>

        <!-- Nastavovací panel -->
        <div class="control-panel">
            <select id="modeSelect">
                <option value="night-green">🟢 NIGHT GREEN (Phosphor PVS-14)</option>
                <option value="white-phosphor">⚪ WHITE PHOSPHOR (PVS-31)</option>
                <option value="thermal-predator">🔥 THERMAL FLIR (Predator)</option>
                <option value="cyber-xray">🟣 CYBER X-RAY / WALL-GLOW</option>
                <option value="red-spec">🔴 RED TACTICAL</option>
            </select>

            <select id="resSelect">
                <option value="yt-shorts">📱 YT SHORTS (1080x1920 / 9:16)</option>
                <option value="1080p" selected>🎬 FULL HD (1920x1080 / 16:9)</option>
                <option value="4k">🌟 4K UHD (3840x2160)</option>
                <option value="720p">⚡ HD 720p</option>
            </select>

            <div class="slider-group">
                <label>NOČNÉ SVETLO (GAIN):</label>
                <input type="range" id="gainSlider" min="1" max="4" step="0.1" value="2.2">
            </div>

            <div class="slider-group">
                <label>WALL GLOW / AURA:</label>
                <input type="range" id="glowSlider" min="0" max="100" value="65">
            </div>

            <button id="recBtn" class="btn-record">⏺ SPUSTIŤ NAHRÁVANIE</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const modeSelect = document.getElementById('modeSelect');
        const resSelect = document.getElementById('resSelect');
        const gainSlider = document.getElementById('gainSlider');
        const glowSlider = document.getElementById('glowSlider');
        const recBtn = document.getElementById('recBtn');
        const recStatus = document.getElementById('recStatus');
        const recTimer = document.getElementById('recTimer');
        const fpsCounter = document.getElementById('fpsCounter');
        const gainIndicator = document.getElementById('gainIndicator');
        const resIndicator = document.getElementById('resIndicator');

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let recStartTime = 0;
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        // Rozlíšenia
        const resolutions = {
            'yt-shorts': { w: 1080, h: 1920 },
            '1080p': { w: 1920, h: 1080 },
            '4k': { w: 3840, h: 2160 },
            '720p': { w: 1280, h: 720 }
        };

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    },
                    audio: true
                });
                video.srcObject = stream;
                video.play();
                updateCanvasResolution();
                requestAnimationFrame(renderLoop);
            } catch (err) {
                alert("Chyba pri zapínaní kamery: " + err.message);
            }
        }

        function updateCanvasResolution() {
            const config = resolutions[resSelect.value];
            canvas.width = config.w;
            canvas.height = config.h;
            resIndicator.innerText = `RES: ${config.w}x${config.h} @60FPS`;
        }

        resSelect.addEventListener('change', updateCanvasResolution);

        gainSlider.addEventListener('input', () => {
            gainIndicator.innerText = `LIGHT GAIN: +${Math.round(gainSlider.value * 100)}%`;
        });

        // Spracovanie obrazu & GLOW BIO/WALL algoritmus
        function renderLoop(timestamp) {
            frameCount++;
            if (timestamp - lastFrameTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFrameTime = timestamp;
                fpsCounter.innerText = `FPS: ${fps}`;
            }

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Vykreslenie videa do canvasu podľa vybraného formátu
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let d = imgData.data;

                let gain = parseFloat(gainSlider.value);
                let glowIntensity = parseFloat(glowSlider.value) / 100;
                let mode = modeSelect.value;

                // Prechod cez pixely
                for (let i = 0; i < d.length; i += 4) {
                    let r = d[i];
                    let g = d[i + 1];
                    let b = d[i + 2];

                    // Zosilnenie svetla v tme (Night Vision Boost)
                    let brightness = (0.299 * r + 0.587 * g + 0.114 * b) * gain;
                    
                    // Simulácia šumu fotónov (Night Grain)
                    let noise = (Math.random() - 0.5) * 25;
                    brightness += noise;
                    brightness = Math.min(255, Math.max(0, brightness));

                    // Glow/Aura efekt na hranách/siluetách (Bio Aura)
                    let edgeGlow = (r > 100 || g > 100 || b > 100) ? glowIntensity * 50 : 0;

                    if (mode === 'night-green') {
                        d[i] = edgeGlow * 0.2;                         // R
                        d[i + 1] = brightness + edgeGlow;             // G (Silná zelená)
                        d[i + 2] = edgeGlow * 0.4;                    // B
                    } 
                    else if (mode === 'white-phosphor') {
                        d[i] = brightness * 0.85 + edgeGlow;
                        d[i + 1] = brightness + edgeGlow;
                        d[i + 2] = brightness * 1.15 + edgeGlow * 1.5; // Studená modro-biela
                    } 
                    else if (mode === 'thermal-predator') {
                        // Termovízia FLIR (Ironbow)
                        let heat = brightness + edgeGlow;
                        d[i] = heat > 128 ? 255 : heat * 2;            // Red
                        d[i + 1] = heat > 180 ? 255 : (heat > 80 ? heat : 0); // Yellow/Green
                        d[i + 2] = heat < 128 ? 255 - heat * 2 : 0;   // Blue
                    } 
                    else if (mode === 'cyber-xray') {
                        // Neónový fialovo-azúrový glow
                        d[i] = (255 - brightness) * 0.5 + edgeGlow * 2;
                        d[i + 1] = edgeGlow * 2;
                        d[i + 2] = brightness + edgeGlow * 2.5;
                    } 
                    else if (mode === 'red-spec') {
                        d[i] = brightness * 1.3 + edgeGlow * 2;
                        d[i + 1] = 0;
                        d[i + 2] = 0;
                    }
                }

                ctx.putImageData(imgData, 0, 0);

                // Neónový HUD overlay vykreslený priamo do videa (pre nahrávanie)
                drawTacticalHUD();
            }

            if (isRecording) {
                let elapsed = Math.floor((Date.now() - recStartTime) / 1000);
                let mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                let secs = String(elapsed % 60).padStart(2, '0');
                recTimer.innerText = `${mins}:${secs}`;
            }

            requestAnimationFrame(renderLoop);
        }

        // Kreslenie taktického radaru priamo do exportovaného videa
        function drawTacticalHUD() {
            ctx.strokeStyle = "rgba(0, 255, 100, 0.4)";
            ctx.lineWidth = 2;
            
            // Rohové taktické zameriavače
            const len = 40;
            const w = canvas.width;
            const h = canvas.height;

            // TL
            ctx.beginPath();
            ctx.moveTo(30, 30 + len); ctx.lineTo(30, 30); ctx.lineTo(30 + len, 30);
            // TR
            ctx.moveTo(w - 30 - len, 30); ctx.lineTo(w - 30, 30); ctx.lineTo(w - 30, 30 + len);
            // BL
            ctx.moveTo(30, h - 30 - len); ctx.lineTo(30, h - 30); ctx.lineTo(30 + len, h - 30);
            // BR
            ctx.moveTo(w - 30 - len, h - 30); ctx.lineTo(w - 30, h - 30); ctx.lineTo(w - 30, h - 30 - len);
            ctx.stroke();
        }

        // Nahrávanie videa
        recBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        function startRecording() {
            recordedChunks = [];
            const stream = canvas.captureStream(60); // 60 FPS Stream

            // Pridanie mikrofónu do záznamu
            if (video.srcObject && video.srcObject.getAudioTracks().length > 0) {
                stream.addTrack(video.srcObject.getAudioTracks()[0]);
            }

            let options = { mimeType: 'video/webm; codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' };
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = saveVideo;

            mediaRecorder.start(100);
            isRecording = true;
            recStartTime = Date.now();
            recBtn.classList.add('recording');
            recBtn.innerText = "⏹ ZASTAVIŤ A ULOŽIŤ";
            recStatus.style.display = "block";
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            recBtn.classList.remove('recording');
            recBtn.innerText = "⏺ SPUSTIŤ NAHRÁVANIE";
            recStatus.style.display = "none";
        }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `NIGHT_VISION_${resSelect.value}_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
